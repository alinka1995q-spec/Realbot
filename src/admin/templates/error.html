<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} — {{ title }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card" style="text-align:center; max-width: 480px;">
      <h1 style="font-size: 48px; margin: 0; color: var(--color-primary);">{{ code }}</h1>
      <p style="font-size: 18px; font-weight: 600; margin: 16px 0 8px;">{{ title }}</p>
      <p style="color: var(--color-text-muted);">{{ message }}</p>
      {% if details %}
      <div style="text-align: left; background: var(--color-bg); padding: 12px; border-radius: 8px; margin: 16px 0; font-size: 12px; color: var(--color-text-muted);">
        {% for d in details %}<div>{{ d }}</div>{% endfor %}
      </div>
      {% endif %}
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <a class="btn" href="javascript:history.back()" style="flex:1;">Назад</a>
        <a class="btn btn-primary" href="{{ back }}" style="flex:1;">На главную</a>
      </div>
    </div>
  </div>
</body>
</html>
