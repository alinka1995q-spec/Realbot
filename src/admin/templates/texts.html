{% extends "base.html" %}
{% block title %}Тексты{% endblock %}
{% block content %}
<h1>Тексты бота</h1>
<div class="tabs">
  <a href="?lang=ru" class="{% if lang=='ru' %}active{% endif %}">RU</a>
  <a href="?lang=kg" class="{% if lang=='kg' %}active{% endif %}">KG</a>
</div>

<div class="panel">
  {% if rows %}
  <table>
    <tr><th>Ключ</th><th>По умолчанию</th><th>Текущее значение</th><th></th></tr>
    {% for r in rows %}
    <tr>
      <td><code>{{ r.key }}</code></td>
      <td style="color: var(--color-text-muted); max-width: 250px;">{{ r.default[:160] }}</td>
      <td style="min-width: 320px;">
        <form method="post" action="/texts/save" class="flex-row">
          <input type="hidden" name="key" value="{{ r.key }}">
          <input type="hidden" name="lang" value="{{ lang }}">
          <input name="value" value="{{ r.override }}" style="flex:1; min-width: 260px;">
          <button class="btn btn-sm btn-primary">Сохранить</button>
        </form>
      </td>
      <td></td>
    </tr>
    {% endfor %}
  </table>
  {% else %}<div class="empty"><h3>Текстов нет</h3></div>{% endif %}
</div>
{% endblock %}
